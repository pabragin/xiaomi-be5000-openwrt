<svg xmlns="http://www.w3.org/2000/svg" width="980" height="400" viewBox="0 0 980 400" font-family="Helvetica, Arial, sans-serif">
  <rect width="980" height="400" fill="#ffffff"/>
  <text x="20" y="32" font-size="20" font-weight="bold" fill="#111">Подключение UART и GPIO0 / UART and GPIO0 wiring</text>

  <rect x="40" y="70" width="250" height="250" rx="12" fill="#e7f1ff" stroke="#0a58ca" stroke-width="2"/>
  <text x="165" y="100" font-size="16" font-weight="bold" text-anchor="middle">USB-UART 3.3 V</text>
  <text x="165" y="120" font-size="12" text-anchor="middle" fill="#555">CP2102 / CH340 / FT232</text>
  <g font-size="15">
    <circle cx="270" cy="160" r="9" fill="#212529"/><text x="250" y="165" text-anchor="end">GND</text>
    <circle cx="270" cy="210" r="9" fill="#198754"/><text x="250" y="215" text-anchor="end">TXD</text>
    <circle cx="270" cy="260" r="9" fill="#0d6efd"/><text x="250" y="265" text-anchor="end">RXD</text>
    <circle cx="270" cy="300" r="9" fill="#adb5bd"/><text x="250" y="305" text-anchor="end" fill="#888">VCC</text>
  </g>

  <rect x="640" y="70" width="300" height="250" rx="12" fill="#f1f3f5" stroke="#37474f" stroke-width="2"/>
  <text x="790" y="100" font-size="16" font-weight="bold" text-anchor="middle">Xiaomi BE5000</text>
  <text x="790" y="120" font-size="12" text-anchor="middle" fill="#555">UART 115200 8N1</text>
  <g font-size="15">
    <circle cx="660" cy="160" r="9" fill="#212529"/><text x="680" y="165">GND</text>
    <circle cx="660" cy="210" r="9" fill="#0d6efd"/><text x="680" y="215">RX</text>
    <circle cx="660" cy="260" r="9" fill="#198754"/><text x="680" y="265">TX</text>
    <circle cx="660" cy="300" r="9" fill="#adb5bd"/><text x="680" y="305" fill="#888">3.3 V — не подключать</text>
  </g>
  <g stroke-width="3" fill="none">
    <line x1="279" y1="160" x2="651" y2="160" stroke="#212529"/>
    <line x1="279" y1="210" x2="651" y2="210" stroke="#198754"/>
    <line x1="279" y1="260" x2="651" y2="260" stroke="#0d6efd"/>
    <line x1="279" y1="300" x2="420" y2="300" stroke="#adb5bd" stroke-dasharray="6 6"/>
  </g>
  <text x="465" y="200" font-size="13" text-anchor="middle" fill="#198754">TX → RX</text>
  <text x="465" y="252" font-size="13" text-anchor="middle" fill="#0d6efd">RX ← TX</text>
  <text x="440" y="305" font-size="13" fill="#888">✕ VCC</text>

  <g font-size="14" fill="#111">
    <text x="20" y="352">GPIO0 (площадка у угла SoC, см. фото) замкнуть на GND при включении — только для восстановления.</text>
    <text x="20" y="372">Short GPIO0 (pad next to the SoC corner, see photo) to GND while powering on — recovery only.</text>
    <text x="20" y="392" fill="#555">Если в логе тишина — поменяйте TX и RX местами. / No output at all — swap TX and RX.</text>
  </g>
</svg>
