<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" font-family="Helvetica, Arial, sans-serif">
  <rect width="980" height="430" fill="#ffffff"/>
  <text x="20" y="32" font-size="20" font-weight="bold" fill="#111">SPI-NAND 128 MiB: flash layout (0x0 – 0x75E0000)</text>

  <!-- scale: 0x0..0xC00000 mapped to x=170..960 (790 px) => 1 px = 0x3E40 ~ 16 KiB; use piecewise for readability -->
  <text x="20" y="92" font-size="15" font-weight="bold" fill="#111">Stock</text>
  <text x="20" y="110" font-size="13" fill="#555">Xiaomi</text>
  <g font-size="12" text-anchor="middle">
    <rect x="170" y="70" width="100" height="56" fill="#cfd8dc" stroke="#37474f"/><text x="220" y="94">Bootloader</text><text x="220" y="112" fill="#444">0x0</text>
    <rect x="270" y="70" width="100" height="56" fill="#fff3cd" stroke="#37474f"/><text x="320" y="94">u-boot-env</text><text x="320" y="112" fill="#444">0x80000</text>
    <rect x="370" y="70" width="100" height="56" fill="#fff3cd" stroke="#37474f"/><text x="420" y="94">bdata (MAC)</text><text x="420" y="112" fill="#444">0x100000</text>
    <rect x="470" y="70" width="170" height="56" fill="#f8d7da" stroke="#b02a37" stroke-width="2"/><text x="555" y="94" font-weight="bold">Factory (Wi-Fi EEPROM)</text><text x="555" y="112" fill="#444">0x180000</text>
    <rect x="640" y="70" width="70" height="56" fill="#eceff1" stroke="#37474f"/><text x="675" y="94">crash</text><text x="675" y="112" fill="#444">0x580000</text>
    <rect x="710" y="70" width="110" height="56" fill="#e2e3e5" stroke="#37474f"/><text x="765" y="94">kernel</text><text x="765" y="112" fill="#444">0x600000</text>
    <rect x="820" y="70" width="140" height="56" fill="#e2e3e5" stroke="#37474f"/><text x="890" y="94">ubi …</text><text x="890" y="112" fill="#444">0xC00000</text>
  </g>

  <text x="20" y="232" font-size="15" font-weight="bold" fill="#111">New</text>
  <text x="20" y="250" font-size="13" fill="#555">OpenWrt</text>
  <g font-size="12" text-anchor="middle">
    <rect x="170" y="210" width="94" height="56" fill="#d1e7dd" stroke="#146c43" stroke-width="2"/><text x="217" y="234" font-weight="bold">u-boot</text><text x="217" y="252" fill="#444">0x0</text>
    <rect x="264" y="210" width="6" height="56" fill="#fff3cd" stroke="#37474f"/>
    <rect x="270" y="210" width="50" height="56" fill="#cfd8dc" stroke="#37474f"/><text x="295" y="234">art</text><text x="295" y="252" fill="#444">blk 1</text>
    <rect x="320" y="210" width="50" height="56" fill="#f8d7da" stroke="#b02a37" stroke-width="2"/><text x="345" y="234" font-weight="bold">CAL</text><text x="345" y="252" fill="#444">0xA0000</text>
    <rect x="370" y="210" width="222" height="56" fill="#cfe2ff" stroke="#0a58ca" stroke-width="2"/><text x="481" y="234" font-weight="bold">firmware: FIT + squashfs</text><text x="481" y="252" fill="#444">0xC0000, 24 MiB</text>
    <rect x="592" y="210" width="368" height="56" fill="#e0cffc" stroke="#6f42c1" stroke-width="2"/><text x="776" y="234" font-weight="bold">ubi-data: rootfs_data (UBIFS, settings)</text><text x="776" y="252" fill="#444">0x18C0000, 93 MiB</text>
  </g>
  <text x="267" y="290" font-size="11" fill="#555" text-anchor="middle">u-boot-env 0x7C000 (16 KiB, RO)</text>

  <g font-size="13" fill="#111">
    <line x1="555" y1="128" x2="345" y2="206" stroke="#b02a37" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
    <text x="470" y="170" fill="#b02a37">first 7680 EEPROM bytes → 0xA0000</text>
  </g>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b02a37"/></marker></defs>

  <g font-size="13" fill="#333">
    <text x="20" y="335">⚠ firmware at 0xC0000 overwrites stock bdata and Factory — back up and move the calibration first.</text>
    <text x="20" y="365">Bootloader (0x0–0x80000) = BL2 + BL31 + U-Boot in one FIP (header 0xAA640001 at offset 0x800).</text>
  </g>
</svg>
